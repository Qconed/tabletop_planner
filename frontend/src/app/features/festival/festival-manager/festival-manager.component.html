<div class="festival-manager">
  <div class="toolbar">
    <h2 class="page-title">Gestion des Festivals</h2>
    <button mat-raised-button color="primary" (click)="openCreateFestivalDialog()">
      <mat-icon>add</mat-icon>
      Créer un festival
    </button>
  </div>
  
  <div class="content">
    <app-festival-list 
      [festivals]="festivals()"
      (festivalClicked)="openFestivalDetailsDialog($event)">
    </app-festival-list>
  </div>
</div>
