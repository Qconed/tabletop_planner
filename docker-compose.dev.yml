# This compose uses environment variables from .env.dev file
# In prod, these values should be written in a .env file

networks:
  ttp-network:
    driver: bridge
    name: ttp-network-dev
services:
  postgres:
    networks:
      - ttp-network  
    image: postgres:16-alpine
    container_name: ttp-postgres
    restart: "unless-stopped"
    ports:
      - 5432:5432
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ttp_data:/var/lib/postgresql/data
  # =============================
  backend:
    networks:
      - ttp-network
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ttp-backend-dev
    restart: unless-stopped
    ports:
      - 3000:3000 # web server: host 3000 to container port 3000
    env_file:
      - .env.dev
    environment:
      # Database URL for container network (uses postgres hostname)
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      
    volumes:
      # in dev version of container, mount the src code for hot reload
      - ./backend:/app:cached # cached enables slow refresh latency
      - ./backend/node_modules:/app/node_modules # dependencies at runtime will be the deps installed locally
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run","dev:compose"]
    # use the container in an interactive terminal (terminal colors + allow standard input)
    tty: true
    stdin_open: true
  prisma-studio: # direct db access using prisma (dev version only)
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ttp-prisma-studio
    restart: unless-stopped
    ports: 
      - "5555:5555"
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"

    volumes:
      - ./backend/prisma:/app/prisma:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ttp-network
    command: ["npm", "run", "prisma:studio"]
    tty: true
    stdin_open: true
  
  # ===========================
  # ===========================

  frontend:
    networks:
      - ttp-network
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ttp-frontend-dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    env_file:
      - .env.dev
    environment:
      NODE_ENV: ${NODE_ENV}
      NG_CLI_ANALYTICS: "false" # Prevents Angular CLI from hanging on analytics consent prompt

    volumes:
      # Source code mounts for dev purposes
      - ./frontend:/app:cached
      - ./frontend/node_modules:/app/node_modules
      # SSL certificates for HTTPS
      - ./frontend/certs:/app/certs:ro

    command: ["npm","run","start:dev"]
    tty: true
    stdin_open: true

volumes:
  ttp_data:
    name: ttp-postgres-data
