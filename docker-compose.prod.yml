# Production docker compose file
# Uses env vars defined in .env

networks:
  ttp-network:
    driver: bridge
    name: ttp-network-prod

volumes:
  ttp_data:
    name: ttp-postgres-data-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: ttp-postgres-prod
    restart: unless-stopped
    networks:
      - ttp-network
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ttp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ttp-backend-prod
    restart: unless-stopped
    networks:
      - ttp-network
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health').then(res => {if(res.ok){process.exit(0);}process.exit(1);}).catch(() => process.exit(1));\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ttp-frontend-prod
    restart: unless-stopped
    networks:
      - ttp-network
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8443}:443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider --no-check-certificate https://localhost/healthz || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
