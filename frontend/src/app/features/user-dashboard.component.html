
<mat-card class="dashboard-card">
    <mat-card-header>
    <mat-card-title>Welcome!</mat-card-title>
    </mat-card-header>
    <mat-card-content>
    @if (authService.currentUser()) {
        <div class="welcome-message">
        <h2>Hello, {{ authService.currentUser()?.username }}!</h2>
        <p>Email: {{ authService.currentUser()?.email }}</p>
        <p class="member-since">Member since: {{ formatDate(authService.currentUser()?.createdAt) }}</p>
        </div>
        
        @if (errorMessage()) {
        <div class="error-message">{{ errorMessage() }}</div>
        }
        
        <div class="button-container">
        <button 
            mat-raised-button 
            color="warn" 
            (click)="logout()"
            [disabled]="isLoggingOut()">
            @if (isLoggingOut()) {
            <mat-spinner diameter="20"></mat-spinner>
            Logging out...
            } @else {
            Logout
            }
        </button>
        </div>
    }
    </mat-card-content>
</mat-card>
